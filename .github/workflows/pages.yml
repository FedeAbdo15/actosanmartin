# Publica el juego en GitHub Pages.
#
# Reemplaza a static.yml, la plantilla "Static HTML" de GitHub, que subia el
# repo entero sin compilar (path: '.'). Eso publicaba el index.html del codigo
# fuente, que apunta a /src/main.js: un archivo que sin compilar no existe, y
# que aunque existiera no correria en el navegador (importa 'leaflet' por
# nombre). Resultado: pagina en blanco. Este workflow compila primero.
#
# En Settings -> Pages, Source tiene que estar en "GitHub Actions".

name: Deploy a GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez; si se empujan dos commits seguidos, gana el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # El build no usa el navegador: no hace falta bajarlo en cada corrida.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
