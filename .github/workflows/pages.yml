# Publica el juego en GitHub Pages.
#
# El repo no versiona dist/, asi que Pages no puede servir la rama tal cual: el
# index.html del repo apunta a /src/main.js, que sin compilar no existe. Este
# workflow compila y sube el resultado.
#
# Requiere una vez, en Settings -> Pages -> Source: "GitHub Actions".

name: Deploy a GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez; si se empujan dos commits seguidos, gana el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # El build no usa el navegador: no hace falta bajarlo en cada corrida.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
